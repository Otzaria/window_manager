name: Temporary Dart formatter capture

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/format-capture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Capture formatted source as UTF-8
        shell: bash
        run: |
          for path in lib/src/widgets/window_caption_button.dart test/window_caption_path_cache_test.dart test/window_caption_test.dart; do
            if [ -f "$path" ]; then
              dart format "$path"
              echo "FORMAT_BEGIN $path"
              base64 -w 0 "$path"
              echo
              echo "FORMAT_END $path"
            fi
          done
